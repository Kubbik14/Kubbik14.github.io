```html
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anet ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at 20% 20%, #ff6b9d55, transparent 35%),
                radial-gradient(circle at 80% 80%, #ff4f8155, transparent 35%),
                #160b16;

            overflow: hidden;
        }

        .profile {
            text-align: center;
            position: relative;
            z-index: 2;

            /* ještě trochu výš */
            transform: translateY(-90px);
        }

        .pfp {
            width: 230px;
            height: 230px;

            object-fit: cover;
            border-radius: 50%;

            border: 5px solid white;

            box-shadow:
                0 0 20px #ff6b9d,
                0 0 50px #ff4f8188;

            animation: appear 1s ease;
        }

        h1 {
            margin: 20px 0 5px;

            color: white;
            font-size: 42px;
            letter-spacing: 2px;

            text-shadow:
                0 0 10px #ff6b9d,
                0 0 25px #ff4f81;

            animation: appear 1s ease;
        }

        /* nový text pod jménem */
        .bio {
            color: #ffc4d8;
            font-size: 16px;
            margin-top: 8px;

            letter-spacing: 1px;

            text-shadow: 0 0 10px #ff6b9d;

            animation: appear 1.2s ease;
        }

        /* oddělovací čára */
        .line {
            width: 80px;
            height: 2px;

            margin: 18px auto;

            border-radius: 10px;

            background: #ff6b9d;

            box-shadow:
                0 0 10px #ff6b9d,
                0 0 20px #ff4f81;

            animation: glow 2s ease-in-out infinite;
        }

        /* malá statistika */
        .stats {
            display: flex;
            justify-content: center;
            gap: 35px;

            margin-top: 15px;
        }

        .stat {
            color: white;
            font-size: 15px;
        }

        .stat span {
            display: block;

            color: #ff8fb6;
            font-size: 20px;
            font-weight: bold;

            margin-bottom: 3px;

            text-shadow: 0 0 10px #ff4f81;
        }

        /* tlačítko */
        .button {
            display: inline-block;

            margin-top: 22px;
            padding: 11px 25px;

            color: white;
            text-decoration: none;

            border: 1px solid #ff6b9d88;
            border-radius: 30px;

            background: #ff6b9d18;

            box-shadow:
                0 0 15px #ff6b9d33;

            transition: .3s ease;
        }

        .button:hover {
            background: #ff6b9d33;

            transform: translateY(-3px);

            box-shadow:
                0 0 20px #ff6b9d88;
        }

        /* srdíčka */
        .heart {
            position: absolute;

            color: #ff6b9d;
            font-size: 28px;

            animation: float 3s ease-in-out infinite;

            text-shadow: 0 0 15px #ff4f81;
        }

        .heart:nth-child(1) {
            top: -30px;
            left: -50px;
            animation-delay: 0s;
        }

        .heart:nth-child(2) {
            top: 40px;
            right: -60px;
            animation-delay: .5s;
        }

        .heart:nth-child(3) {
            bottom: 80px;
            left: -75px;
            animation-delay: 1s;
        }

        .heart:nth-child(4) {
            bottom: 20px;
            right: -65px;
            animation-delay: 1.5s;
        }

        .heart:nth-child(5) {
            top: -60px;
            right: 10px;

            font-size: 20px;

            animation-delay: .8s;
        }

        .heart:nth-child(6) {
            bottom: -40px;
            left: 30px;

            font-size: 22px;

            animation-delay: 1.8s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-15px) scale(1.15);
            }
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: scale(.7);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes glow {
            0%, 100% {
                opacity: .6;
                transform: scaleX(1);
            }

            50% {
                opacity: 1;
                transform: scaleX(1.15);
            }
        }

        /* mobil */
        @media (max-width: 500px) {

            .profile {
                transform: translateY(-60px);
            }

            .pfp {
                width: 190px;
                height: 190px;
            }

            h1 {
                font-size: 36px;
            }

            .heart:nth-child(3) {
                left: -35px;
            }

            .heart:nth-child(4) {
                right: -35px;
            }
        }
    </style>
</head>

<body>

    <div class="profile">

        <span class="heart">♥</span>
        <span class="heart">♥</span>
        <span class="heart">♥</span>
        <span class="heart">♥</span>
        <span class="heart">♥</span>
        <span class="heart">♥</span>

        <img
            class="pfp"
            src="pfp.png"
            alt="Anet"
        >

        <h1>Anet</h1>

        <div class="bio">
            ♡ just being me ♡
        </div>

        <div class="line"></div>

        <div class="stats">
            <div class="stat">
                <span>♡</span>
                vibes
            </div>

            <div class="stat">
                <span>∞</span>
                dreams
            </div>

            <div class="stat">
                <span>♥</span>
                love
            </div>
        </div>

        <a href="#" class="button">
            ✨ little things ✨
        </a>

    </div>

</body>
</html>
```
