```html
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anet ❤️ Kuba</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at 20% 20%, #ff6b9d55, transparent 35%),
                radial-gradient(circle at 80% 80%, #ff4f8155, transparent 35%),
                #160b16;

            overflow: hidden;
        }

        /* HLAVNÍ OBSAH */
        .profile {
            position: relative;
            z-index: 2;

            text-align: center;

            width: 100%;
            max-width: 1200px;

            transform: translateY(-40px);
        }

        /* =========================
           FOTKY
           ========================= */

        .people {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 180px;

            transition: gap 1.2s cubic-bezier(.68,-0.55,.27,1.55);
        }

        /* Po kliknutí se fotky přiblíží */
        .profile.active .people {
            gap: 35px;
        }

        .person {
            display: flex;
            align-items: center;

            gap: 30px;

            position: relative;
        }

        .person-info {
            text-align: center;
        }

        .pfp {
            width: 210px;
            height: 210px;

            object-fit: cover;

            border-radius: 50%;
            border: 5px solid white;

            box-shadow:
                0 0 20px #ff6b9d,
                0 0 50px #ff4f8188;

            transition:
                transform 1.2s ease,
                box-shadow 1.2s ease;
        }

        /* Po kliknutí trochu září */
        .profile.active .pfp {
            box-shadow:
                0 0 25px #ff6b9d,
                0 0 60px #ff4f81,
                0 0 100px #ff6b9d55;
        }

        .name {
            margin-top: 18px;

            color: white;

            font-size: 32px;
            font-weight: bold;

            letter-spacing: 2px;

            text-shadow:
                0 0 10px #ff6b9d,
                0 0 25px #ff4f81;
        }


        /* =========================
           INSTAGRAM
           ========================= */

        .instagram {
            width: 65px;
            height: 65px;

            flex-shrink: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            border: 1px solid #ff6b9d88;
            border-radius: 18px;

            background: #ff6b9d18;

            box-shadow:
                0 0 15px #ff6b9d66,
                0 0 35px #ff4f8144;

            transition: .3s ease;

            text-decoration: none;
        }

        .instagram svg {
            width: 38px;
            height: 38px;

            fill: none;
            stroke: white;
            stroke-width: 2;
        }

        .instagram:hover {
            transform: scale(1.1);

            background: #ff6b9d33;

            box-shadow:
                0 0 20px #ff6b9d99,
                0 0 45px #ff4f8166;
        }


        /* =========================
           TLAČÍTKO
           ========================= */

        .love-button {
            margin-top: 55px;

            padding: 14px 35px;

            color: white;

            font-size: 17px;
            font-weight: bold;

            letter-spacing: 1px;

            border: 1px solid #ff6b9d99;
            border-radius: 30px;

            background: #ff6b9d18;

            box-shadow:
                0 0 15px #ff6b9d44;

            cursor: pointer;

            transition: .3s ease;
        }

        .love-button:hover {
            transform: scale(1.07);

            background: #ff6b9d33;

            box-shadow:
                0 0 20px #ff6b9d99,
                0 0 45px #ff4f8155;
        }

        .profile.active .love-button {
            background: #ff6b9d33;

            box-shadow:
                0 0 20px #ff6b9d99,
                0 0 50px #ff4f8166;
        }


        /* =========================
           SRDÍČKA
           ========================= */

        .hearts {
            position: absolute;

            left: 50%;
            top: 40%;

            width: 500px;
            height: 300px;

            transform: translate(-50%, -50%);

            pointer-events: none;

            opacity: 0;

            transition: opacity .5s ease;
        }

        .profile.active .hearts {
            opacity: 1;
        }

        .heart {
            position: absolute;

            color: #ff6b9d;

            font-size: 30px;

            text-shadow:
                0 0 10px #ff4f81,
                0 0 25px #ff6b9d;

            opacity: 0;
        }

        .profile.active .heart {
            animation: heartAppear 1.5s ease forwards,
                       float 3s ease-in-out infinite;
        }

        .heart:nth-child(1) {
            left: 5%;
            top: 35%;
            animation-delay: .1s;
        }

        .heart:nth-child(2) {
            left: 20%;
            top: 5%;
            animation-delay: .25s;
        }

        .heart:nth-child(3) {
            left: 40%;
            top: 45%;
            animation-delay: .4s;
        }

        .heart:nth-child(4) {
            left: 60%;
            top: 10%;
            animation-delay: .55s;
        }

        .heart:nth-child(5) {
            left: 78%;
            top: 40%;
            animation-delay: .7s;
        }

        .heart:nth-child(6) {
            left: 90%;
            top: 15%;
            animation-delay: .85s;
        }

        .heart:nth-child(7) {
            left: 30%;
            top: 80%;
            animation-delay: 1s;
        }

        .heart:nth-child(8) {
            left: 70%;
            top: 75%;
            animation-delay: 1.15s;
        }

        @keyframes heartAppear {
            from {
                opacity: 0;
                transform: scale(0);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes float {
            0%, 100% {
                margin-top: 0;
            }

            50% {
                margin-top: -12px;
            }
        }


        /* =========================
           MOBIL
           ========================= */

        @media (max-width: 700px) {

            .profile {
                transform: translateY(-20px);

                padding: 0 10px;
            }

            /*
             * Pořád vedle sebe,
             * nikdy ne pod sebou.
             */
            .people {
                gap: 35px;
            }

            .profile.active .people {
                gap: 5px;
            }

            .person {
                gap: 10px;
            }

            .pfp {
                width: 125px;
                height: 125px;

                border-width: 4px;
            }

            .name {
                font-size: 22px;
                margin-top: 12px;
                letter-spacing: 1px;
            }

            .instagram {
                width: 45px;
                height: 45px;

                border-radius: 13px;
            }

            .instagram svg {
                width: 27px;
                height: 27px;
            }

            .love-button {
                margin-top: 40px;

                padding: 13px 28px;

                font-size: 15px;
            }

            .hearts {
                width: 350px;
                height: 250px;
            }

            .heart {
                font-size: 23px;
            }
        }


        /* EXTRA MALÝ TELEFON */

        @media (max-width: 430px) {

            .people {
                gap: 20px;
            }

            .profile.active .people {
                gap: 0;
            }

            .person {
                gap: 7px;
            }

            .pfp {
                width: 105px;
                height: 105px;
            }

            .instagram {
                width: 38px;
                height: 38px;
            }

            .instagram svg {
                width: 23px;
                height: 23px;
            }

            .name {
                font-size: 19px;
            }

            .love-button {
                margin-top: 30px;
            }
        }

    </style>
</head>
