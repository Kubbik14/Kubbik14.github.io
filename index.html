<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kuba</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Poppins", sans-serif;
            color: white;

            background:
                radial-gradient(
                    circle at 20% 10%,
                    rgba(255, 0, 128, 0.25),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(140, 0, 255, 0.25),
                    transparent 35%
                ),
                #0b0710;

            display: flex;
            justify-content: center;
            padding: 100px 20px 50px;
        }

        /* =========================
           PROGRAMOVÁNÍ
        ========================= */

        .programming-button {
            position: fixed;
            top: 25px;
            left: 25px;

            padding: 11px 17px;

            border-radius: 14px;

            color: white;
            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            transition: 0.3s ease;

            z-index: 100;
        }

        .programming-button:hover {
            transform: translateY(-3px);

            background: linear-gradient(
                135deg,
                #ff0080,
                #7928ff
            );

            box-shadow:
                0 10px 30px rgba(255, 0, 128, 0.3);
        }

        /* =========================
           SOCIÁLNÍ IKONY
        ========================= */

        .socials {
            position: fixed;
            top: 25px;
            right: 25px;

            display: flex;
            align-items: center;
            gap: 10px;

            z-index: 100;
        }

        .social {
            width: 48px;
            height: 48px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 15px;

            color: white;
            text-decoration: none;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            transition: 0.3s ease;
        }

        .social svg {
            width: 23px;
            height: 23px;

            fill: currentColor;
            display: block;
        }

        .social:hover {
            transform: translateY(-3px) scale(1.05);
        }

        /* Instagram */

        .instagram:hover {
            background: linear-gradient(
                135deg,
                #feda75,
                #fa7e1e,
                #d62976,
                #962fbf,
                #4f5bd5
            );

            box-shadow:
                0 10px 30px rgba(214, 41, 118, 0.4);
        }

        /* TikTok */

        .tiktok:hover {
            background: #111;

            box-shadow:
                0 0 20px rgba(255, 0, 100, 0.5),
                0 0 30px rgba(0, 242, 234, 0.25);
        }

        /* Spotify */

        .spotify:hover {
            background: #1db954;

            box-shadow:
                0 0 20px rgba(30, 215, 96, 0.5);
        }

        /* =========================
           HLAVNÍ KONTEJNER
        ========================= */

        .container {
            width: 100%;
            max-width: 900px;

            text-align: center;

            animation: fadeIn 1s ease;
        }

        /* =========================
           PROFIL
        ========================= */

        .profile {
            display: flex;
            flex-direction: column;
            align-items: center;

            margin-bottom: 45px;
        }

        .profile img {
            width: 145px;
            height: 145px;

            object-fit: cover;
            border-radius: 50%;

            border: 4px solid rgba(255, 255, 255, 0.12);

            box-shadow:
                0 0 35px rgba(255, 0, 128, 0.35),
                0 0 70px rgba(130, 0, 255, 0.2);

            transition: 0.4s ease;
        }

        .profile img:hover {
            transform: scale(1.05) rotate(2deg);

            box-shadow:
                0 0 45px rgba(255, 0, 128, 0.45),
                0 0 85px rgba(130, 0, 255, 0.3);
        }

        .name {
            margin-top: 20px;

            font-size: 32px;
            font-weight: 700;

            background: linear-gradient(
                90deg,
                #ff4da6,
                #b56cff
            );

            -webkit-background-clip: text;
            background-clip: text;

            -webkit-text-fill-color: transparent;
        }

        .username {
            margin-top: 3px;

            color: rgba(255, 255, 255, 0.55);

            font-size: 15px;
        }

        /* =========================
           SONGS
        ========================= */

        .songs {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 20px;

            max-width: 850px;
            margin: 0 auto;
        }

        .song {
            padding: 5px;

            border-radius: 16px;

            background: rgba(255, 255, 255, 0.04);

            border: 1px solid rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            transition: 0.3s ease;
        }

        .song:hover {
            transform: translateY(-5px);

            border-color: rgba(255, 0, 128, 0.3);

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.35);
        }

        .song iframe {
            display: block;

            width: 100%;
            height: 152px;

            border: none;

            border-radius: 12px;
        }

        /* Třetí přehrávač uprostřed */

        .song:nth-child(3) {
            grid-column: 1 / 3;

            width: 50%;

            justify-self: center;
        }

        /* =========================
           ANIMACE
        ========================= */

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           MOBIL
        ========================= */

        @media (max-width: 700px) {

            body {
                padding: 90px 15px 40px;
            }

            .programming-button {
                top: 15px;
                left: 15px;

                padding: 9px 12px;

                font-size: 12px;
                border-radius: 12px;
            }

            .socials {
                top: 15px;
                right: 15px;

                gap: 7px;
            }

            .social {
                width: 43px;
                height: 43px;

                border-radius: 13px;
            }

            .social svg {
                width: 21px;
                height: 21px;
            }

            .profile {
                margin-bottom: 30px;
            }

            .profile img {
                width: 120px;
                height: 120px;
            }

            .name {
                font-size: 27px;
            }

            .songs {
                grid-template-columns: 1fr;
            }

            .song:nth-child(3) {
                grid-column: auto;
                width: 100%;
            }
        }

        /* =========================
           MALÉ MOBILY
        ========================= */

        @media (max-width: 500px) {

            .programming-button {
                font-size: 11px;
                padding: 8px 10px;
            }

            .socials {
                gap: 5px;
            }

            .social {
                width: 40px;
                height: 40px;
            }

            .social svg {
                width: 20px;
                height: 20px;
            }

            .profile img {
                width: 110px;
                height: 110px;
            }

            .name {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         PROGRAMOVACÍ JAZYKY
    ========================= -->

    <a
        href="/programovani"
        class="programming-button"
    >
        Programovací jazyky
    </a>


    <!-- =========================
         SOCIÁLNÍ IKONY
    ========================= -->

    <div class="socials">

        <a

            rel="noopener noreferrer"

            <svg
                viewBox="0 0 24 24"

                <path d="M7.75 2h8.5A5.75 5.75 0 0 1 22 7.75v8.5A5.75 5.75 0 0 1 16.25 22h-8.5A5.75 5.75 0 0 1 2 16.25v-8.5A5.75 5.75 0 0 1 7.75 2zm0 1.8A3.95 3.95 0 0 0 3.8 7.75v8.5a3.95 3.95 0 0 0 3.95 3.95h8.5a3.95 3.95 0 0 0 3.95-3.95v-8.5a3.95 3.95 0 0 0-3.95-3.95h-8.5zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 1.8a3.2 3.2 0 1 0 0 6.4 3.2 3.2 0 0 0 0-6.4zm5.25-2.15a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4z"/>
            </svg>
        </a>


        <!-- TIKTOK -->

        <a
            class="social tiktok"
            href="https://www.tiktok.com/@kubla8"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="TikTok"
        >
            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-3.77V2h-3.35v13.38a2.67 2.67 0 1 1-2.67-2.67c.28 0 .55.04.8.12v-3.4a6.03 6.03 0 1 0 5.22 5.95V8.41a8.13 8.13 0 0 0 4.77 1.54V6.69h-1z"/>
            </svg>
        </a>


        <!-- SPOTIFY -->

        <a
            class="social spotify"
            href="https://open.spotify.com/user/31syoflr5pmr5z54bpnef5olywiq"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Spotify"
        >
            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path d="M12 1.8a10.2 10.2 0 1 0 10.2 10.2A10.21 10.21 0 0 0 12 1.8zm4.68 14.71a.76.76 0 0 1-1.04.25 8.4 8.4 0 0 0-9.28-.47.76.76 0 1 1-.77-1.31 9.92 9.92 0 0 1 10.84.54.76.76 0 0 1 .25.99zm1.38-3.02a.95.95 0 0 1-1.3.31 10.72 10.72 0 0 0-10.91-.5.95.95 0 1 1-.91-1.67 12.62 12.62 0 0 1 12.82.59.95.95 0 0 1 .3 1.27zm.12-3.16a1.14 1.14 0 0 1-1.56.38 13.04 13.04 0 0 0-12.2-.54 1.14 1.14 0 1 1-.98-2.06 15.32 15.32 0 0 1 14.36.64 1.14 1.14 0 0 1 .38 1.58z"/>
            </svg>
        </a>

    </div>


    <!-- =========================
         HLAVNÍ OBSAH
    ========================= -->

    <main class="container">

        <!-- PROFIL -->

        <section class="profile">

            <img
                src="pfp2.jpg"
                alt="Profilová fotka Kuba"
            >

            <h1 class="name">
                Kuba
            </h1>

            <p class="username">
                @kuba
            </p>

        </section>


        <!-- =========================
             SPOTIFY
        ========================= -->

        <section class="songs">

            <!-- ROAR -->

            <div class="song">

                <iframe
                    src="https://open.spotify.com/embed/track/402cQimQUhLUNhwvueCNLC?utm_source=generator"
                    allowfullscreen
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                    loading="lazy">
                </iframe>

            </div>


            <!-- LAST FRIDAY NIGHT -->

            <div class="song">

                <iframe
                    src="https://open.spotify.com/embed/track/73p5eCHpeMqLrDzZk8192A?utm_source=generator"
                    allowfullscreen
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                    loading="lazy">
                </iframe>

            </div>


            <!-- HOT N COLD -->

            <div class="song">

                <iframe
                    src="https://open.spotify.com/embed/track/2lsBnsFTfEcTiIm50wc5r1?utm_source=generator"
                    allowfullscreen
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                    loading="lazy">
                </iframe>

            </div>

        </section>

    </main>

</body>
</html>
