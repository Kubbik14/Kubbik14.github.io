<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kuba</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Poppins", sans-serif;
            color: white;

            background:
                radial-gradient(
                    circle at 20% 10%,
                    rgba(255, 0, 128, 0.25),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(140, 0, 255, 0.25),
                    transparent 35%
                ),
                #0b0710;

            display: flex;
            justify-content: center;
            padding: 50px 20px;
        }

        .instagram {
            position: fixed;
            top: 25px;
            right: 25px;

            width: 48px;
            height: 48px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 15px;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(10px);

            color: white;
            text-decoration: none;

            transition: 0.3s ease;
        }

        .instagram:hover {
            transform: translateY(-3px) scale(1.05);

            background: linear-gradient(
                135deg,
                #ff0080,
                #7928ff
            );

            box-shadow:
                0 10px 30px rgba(255, 0, 128, 0.3);
        }

        .instagram svg {
            width: 25px;
            height: 25px;
        }
        .socials {
    position: absolute;
    top: 25px;
    right: 25px;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 10;
}

.social {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 9px 13px;
    border-radius: 30px;
    color: white;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(10px);
    transition: 0.3s ease;
}

.social svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
}

.social:hover {
    transform: translateY(-3px);
    background: rgba(255, 255, 255, 0.15);
}

.tiktok:hover {
    box-shadow: 0 0 18px rgba(255, 0, 100, 0.5);
}

.spotify:hover {
    box-shadow: 0 0 18px rgba(30, 215, 96, 0.5);
}

@media (max-width: 700px) {
    .socials {
        top: 15px;
        right: 15px;
        gap: 7px;
    }

    .social {
        padding: 8px 10px;
        font-size: 0;
    }

    .social svg {
        width: 21px;
        height: 21px;
    }
}

        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;

            animation: fadeIn 1s ease;
        }

        .profile {
            display: flex;
            flex-direction: column;
            align-items: center;

            margin-bottom: 45px;
        }

        .profile img {
            width: 145px;
            height: 145px;

            object-fit: cover;
            border-radius: 50%;

            border: 4px solid rgba(255, 255, 255, 0.12);

            box-shadow:
                0 0 35px rgba(255, 0, 128, 0.35),
                0 0 70px rgba(130, 0, 255, 0.2);

            transition: 0.4s ease;
        }

        .profile img:hover {
            transform: scale(1.05) rotate(2deg);
        }

        .name {
            margin-top: 20px;

            font-size: 32px;
            font-weight: 700;

            background: linear-gradient(
                90deg,
                #ff4da6,
                #b56cff
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .username {
            margin-top: 3px;

            color: rgba(255, 255, 255, 0.55);

            font-size: 15px;
        }

        .songs {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 20px;

            max-width: 850px;
            margin: 0 auto;
        }

        .song {
            padding: 5px;

            border-radius: 16px;

            background: rgba(255, 255, 255, 0.04);

            border: 1px solid rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(10px);

            transition: 0.3s ease;
        }

        .song:hover {
            transform: translateY(-5px);

            border-color: rgba(255, 0, 128, 0.3);

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.35);
        }

        .song iframe {
            display: block;

            width: 100%;
            height: 152px;

            border: none;

            border-radius: 12px;
        }

        .song:nth-child(3) {
            grid-column: 1 / 3;

            width: 50%;

            justify-self: center;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 700px) {

            body {
                padding: 40px 15px;
            }

            .instagram {
                top: 15px;
                right: 15px;
            }

            .profile {
                margin-bottom: 30px;
            }

            .profile img {
                width: 120px;
                height: 120px;
            }

            .name {
                font-size: 27px;
            }

            .songs {
                grid-template-columns: 1fr;
            }

            .song:nth-child(3) {
                grid-column: auto;
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- Instagram -->

    <a

</div>

</body>
</html>
