<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anet ❤️ Kuba</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at 20% 20%, #ff6b9d55, transparent 35%),
                radial-gradient(circle at 80% 80%, #ff4f8155, transparent 35%),
                #160b16;

            overflow: hidden;
        }

        .profile {
            text-align: center;
            position: relative;
            z-index: 2;

            transform: translate(70px, -50px);
        }

        /* Všechny prvky kolem fotek */
        .people {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 600px;
        }

        /* Osoba */
        .person {
            display: flex;
            align-items: center;
            gap: 35px;
        }

        /* Instagram tlačítko */
        .instagram {
            width: 65px;
            height: 65px;

            flex-shrink: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            border: 1px solid #ff6b9d88;
            border-radius: 18px;

            background: #ff6b9d18;

            box-shadow:
                0 0 15px #ff6b9d66,
                0 0 35px #ff4f8144;

            transition: .3s ease;
        }

        .instagram svg {
            width: 38px;
            height: 38px;

            fill: none;
            stroke: white;
            stroke-width: 2;
        }

        .instagram:hover {
            transform: scale(1.1);

            background: #ff6b9d33;

            box-shadow:
                0 0 20px #ff6b9d99,
                0 0 45px #ff4f8166;
        }

        /* Fotka + jméno */
        .person-info {
            text-align: center;
        }

        .pfp {
            width: 210px;
            height: 210px;

            object-fit: cover;
            border-radius: 50%;

            border: 5px solid white;

            box-shadow:
                0 0 20px #ff6b9d,
                0 0 50px #ff4f8188;

            animation: appear 1s ease;
        }

        .name {
            margin-top: 18px;

            color: white;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;

            text-shadow:
                0 0 10px #ff6b9d,
                0 0 25px #ff4f81;

            animation: appear 1.2s ease;
        }

        /* Srdíčka */
        .heart {
            position: absolute;

            color: #ff6b9d;
            font-size: 28px;

            animation: float 3s ease-in-out infinite;

            text-shadow: 0 0 15px #ff4f81;
        }

        .heart:nth-child(1) {
            top: -30px;
            left: -50px;
            animation-delay: 0s;
        }

        .heart:nth-child(2) {
            top: 40px;
            right: -60px;
            animation-delay: .5s;
        }

        .heart:nth-child(3) {
            bottom: 80px;
            left: -75px;
            animation-delay: 1s;
        }

        .heart:nth-child(4) {
            bottom: 20px;
            right: -65px;
            animation-delay: 1.5s;
        }

        .heart:nth-child(5) {
            top: -60px;
            right: 10px;
            font-size: 20px;
            animation-delay: .8s;
        }

        .heart:nth-child(6) {
            bottom: -40px;
            left: 30px;
            font-size: 22px;
            animation-delay: 1.8s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-15px) scale(1.15);
            }
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: scale(.7);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Mobil */
        @media (max-width: 900px) {

            .profile {
                transform: translate(0, -40px);
            }

            .people {
                gap: 20px;
            }

            .person {
                gap: 15px;
            }

            .pfp {
                width: 150px;
                height: 150px;
            }

            .instagram {
                width: 52px;
                height: 52px;
            }

            .instagram svg {
                width: 30px;
                height: 30px;
            }

            .name {
                font-size: 25px;
            }
        }

        @media (max-width: 650px) {

            .people {
                flex-direction: column;
                gap: 30px;
            }

            .person {
                gap: 20px;
            }

            .pfp {
                width: 130px;
                height: 130px;
            }
        }
    </style>
</head>

<body>

    <div class="profile">

        <!-- Srdíčka -->
        <span class="heart">♥</span>
        <span class="heart">♥</span>
        <span class="heart">♥</span>
        <span class="heart">♥</span>
        <span class="heart">♥</span>
        <span class="heart">♥</span>


        <div class="people">

            <!-- ANET -->
            <div class="person">

                <!-- Instagram Anet vlevo -->
                <a
                    href="https://www.instagram.com/anetous8/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="instagram"
                    aria-label="Instagram Anet"
                >
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="3" width="18" height="18" rx="5"></rect>
                        <circle cx="12" cy="12" r="4"></circle>
                        <circle cx="17.5" cy="6.5" r="1"></circle>
                    </svg>
                </a>

                <div class="person-info">
                    <img
                        class="pfp"

                    >

                    <div class="name">Anet</div>
                </div>

            </div>


            <!-- KUBA -->
            <div class="person">

                <div class="person-info">
                    <img
                        class="pfp"

                    >

                    <div class="name">Kuba</div>
                </div>

                <!-- Instagram Kuba vpravo -->
                <a
                    href="https://www.instagram.com/kubiq.a/"
                    target="_blank"

                    class="instagram"
                    aria-label="Instagram Kuba"
                >
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="3" width="18" height="18" rx="5"></rect>
                        <circle cx="12" cy="12" r="4"></circle>
                        <circle cx="17.5" cy="6.5" r="1"></circle>
                    </svg>
                </a>

            </div>

        </div>

    </div>

</body>
</html>
