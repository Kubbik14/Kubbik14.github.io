<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Klikni na mě</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at 20% 20%, #6c63ff55, transparent 35%),
                radial-gradient(circle at 80% 80%, #00d4ff44, transparent 35%),
                #0b1020;

            color: white;
            overflow: hidden;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 35px;
            text-shadow: 0 0 25px #6c63ff;
        }

        .button {
            padding: 18px 45px;
            border: none;
            border-radius: 16px;

            color: white;
            font-size: 20px;
            font-weight: bold;

            background: linear-gradient(
                135deg,
                #6c63ff,
                #8b5cf6,
                #00bfff
            );

            cursor: pointer;

            box-shadow:
                0 10px 30px #00000055,
                0 0 25px #6c63ff66;

            transition: 0.2s ease;
        }

        .button:hover {
            transform: translateY(-4px) scale(1.04);

            box-shadow:
                0 15px 40px #00000077,
                0 0 40px #6c63ffaa;
        }

        .button:active {
            transform: scale(0.97);
        }

        .hint {
            margin-top: 20px;
            color: #aeb6d9;
            font-size: 14px;
        }

        /* PFP */
        #pfp {
            display: none;

            width: 220px;
            height: 220px;

            object-fit: cover;

            margin: 30px auto 0;

            border-radius: 50%;

            border: 5px solid white;

            box-shadow:
                0 0 20px #6c63ff,
                0 0 60px #00bfff88;

            animation: appear 0.6s ease forwards;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: scale(0.5) rotate(-10deg);
            }

            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>✨ Moje stránka</h1>

        <button class="button" onclick="showPfp()">
            Klikni na mě
        </button>

        <div class="hint" id="hint">
            Zatím se nic nestane... 👀
        </div>

        <img id="pfp" src="pfp.png" alt="PFP">

    </div>

    <script>
        function showPfp() {
            document.getElementById("pfp").style.display = "block";

            document.getElementById("hint").textContent =
                "👀 Tak tady je!";
        }
    </script>

</body>
</html>
