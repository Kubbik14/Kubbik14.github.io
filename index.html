```html
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kuba</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at center, #ff4f8140, transparent 45%),
                #120912;

            font-family: Arial, sans-serif;
        }

        .profile {
            text-align: center;
        }

        .profile img {
            width: 230px;
            height: 230px;

            object-fit: cover;

            border-radius: 50%;
            border: 5px solid white;

            box-shadow:
                0 0 20px #ff4f81,
                0 0 50px #ff4f81aa;

            transition: .4s ease;
        }

        .profile img:hover {
            transform: scale(1.06);

            box-shadow:
                0 0 30px #ff4f81,
                0 0 80px #ff4f81aa;
        }

        .name {
            margin-top: 20px;

            color: white;

            font-size: 36px;
            font-weight: bold;

            letter-spacing: 3px;

            text-shadow:
                0 0 10px #ff4f81,
                0 0 25px #ff4f81;
        }

        @media (max-width: 500px) {
            .profile img {
                width: 180px;
                height: 180px;
            }

            .name {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="profile">

        <img src="pfp2.png" alt="Kuba">

        <div class="name">
            Kuba
        </div>

    </div>

</body>
</html>
