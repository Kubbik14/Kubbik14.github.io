<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Programovací jazyky</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Poppins", sans-serif;
            color: white;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(255, 0, 128, 0.35),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(121, 40, 255, 0.4),
                    transparent 40%
                ),
                #09000f;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        h1 {
            text-align: center;
            font-size: 38px;
            margin-bottom: 40px;

            text-shadow:
                0 0 20px rgba(255, 0, 128, 0.25);
        }

        .language {
            margin-bottom: 25px;

            opacity: 0;
            transform: translateY(15px);

            animation: showLanguage 0.7s ease forwards;
        }

        .language:nth-child(2) {
            animation-delay: 0.1s;
        }

        .language:nth-child(3) {
            animation-delay: 0.25s;
        }

        .language:nth-child(4) {
            animation-delay: 0.4s;
        }

        .language:nth-child(5) {
            animation-delay: 0.55s;
        }

        .language:nth-child(6) {
            animation-delay: 0.7s;
        }

        .language-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 9px;
        }

        .language-name {
            display: flex;
            align-items: center;
            gap: 11px;

            font-size: 17px;
            font-weight: 600;
        }

        .language-logo {
            width: 28px;
            height: 28px;

            object-fit: contain;

            transition: 0.3s ease;
        }

        .language:hover .language-logo {
            transform: scale(1.15) rotate(-3deg);
        }

        .percentage {
            font-size: 14px;
            opacity: 0.75;
        }

        .bar {
            width: 100%;
            height: 13px;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);

            border-radius: 20px;
            overflow: hidden;

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .progress {
            height: 100%;
            width: 0;

            border-radius: 20px;

            background:
                linear-gradient(
                    90deg,
                    #ff0080,
                    #7928ff
                );

            box-shadow:
                0 0 18px rgba(255, 0, 128, 0.35);

            animation:
                fillBar 1.5s cubic-bezier(0.22, 1, 0.36, 1)
                forwards;
        }

        /* Procenta */
        .lua {
            --width: 60%;
            animation-delay: 0.4s;
        }

        .python {
            --width: 50%;
            animation-delay: 0.55s;
        }

        .html {
            --width: 25%;
            animation-delay: 0.7s;
        }

        .css {
            --width: 20%;
            animation-delay: 0.85s;
        }

        .cpp {
            --width: 7%;
            animation-delay: 1s;
        }

        @keyframes fillBar {
            from {
                width: 0;
            }

            to {
                width: var(--width);
            }
        }

        @keyframes showLanguage {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Hover */
        .language:hover .progress {
            filter: brightness(1.2);

            box-shadow:
                0 0 25px rgba(255, 0, 128, 0.55);
        }

        /* Tlačítko zpět */
        .back {
            display: block;
            width: fit-content;

            margin: 40px auto 0;
            padding: 11px 18px;

            color: white;
            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.12);

            border-radius: 14px;

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            transition: 0.3s ease;
        }

        .back:hover {
            transform: translateY(-3px);

            background:
                linear-gradient(
                    135deg,
                    #ff0080,
                    #7928ff
                );

            box-shadow:
                0 10px 30px rgba(255, 0, 128, 0.3);
        }

        @media (max-width: 600px) {
            body {
                padding: 30px 15px;
            }

            h1 {
                font-size: 30px;
                margin-bottom: 30px;
            }

            .language-name {
                font-size: 15px;
            }

            .percentage {
                font-size: 13px;
            }

            .bar {
                height: 11px;
            }

            .language-logo {
                width: 25px;
                height: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Programovací jazyky</h1>

        <!-- LUA 60% -->
        <div class="language">
            <div class="language-header">
                <span class="language-name">

                    <!-- Lua logo -->
                    <svg class="language-logo" viewBox="0 0 100 100" aria-hidden="true">
                        <circle cx="50" cy="50" r="43" fill="#000080"/>
                        <circle cx="50" cy="50" r="36" fill="#ffffff"/>
                        <circle cx="50" cy="50" r="29" fill="#000080"/>
                        <circle cx="50" cy="50" r="15" fill="#ffffff"/>
                        <circle cx="67" cy="33" r="8" fill="#000080"/>
                    </svg>

                    Lua
                </span>

                <span class="percentage">60%</span>
            </div>

            <div class="bar">
                <div class="progress lua"></div>
            </div>
        </div>

        <!-- PYTHON 50% -->
        <div class="language">
            <div class="language-header">
                <span class="language-name">

                    <!-- Python logo -->
                    <svg class="language-logo" viewBox="0 0 256 255" aria-hidden="true">
                        <path
                            fill="#3776AB"
                            d="M126.9 0c-10.5.05-20.5.95-29.3 2.65C71.8 7.8 67.3 18.6 67.3 38.6v26.3h61.1v8.8H44.4c-18.5 0-34.7 11.1-39.8 32.2-5.8 23.8-6.1 38.7 0 63.5 4.5 18.8 15.3 32.2 33.8 32.2h21.8v-31.5c0-22.8 19.7-42.9 43-42.9h61V99.8c0-18.7-15.8-35.2-34.7-38.9-1.9-.3-3.9-.6-6-.9z"
                        />
                        <path
                            fill="#FFD43B"
                            d="M128.7 255c10.5-.05 20.5-.95 29.3-2.65 25.8-5.15 30.3-15.95 30.3-35.95v-26.3h-61.1v-8.8h84c18.5 0 34.7-11.1 39.8-32.2 5.8-23.8 6.1-38.7 0-63.5-4.5-18.8-15.3-32.2-33.8-32.2h-21.8v31.5c0 22.8-19.7 42.9-43 42.9h-61v26.3c0 18.7 15.8 35.2 34.7 38.9 1.9.3 3.9.6 6 .9z"
                        />
                    </svg>

                    Python
                </span>

                <span class="percentage">50%</span>
            </div>

            <div class="bar">
                <div class="progress python"></div>
            </div>
        </div>

        <!-- HTML 25% -->
        <div class="language">
            <div class="language-header">
                <span class="language-name">

                    <!-- HTML logo -->
                    <svg class="language-logo" viewBox="0 0 128 128" aria-hidden="true">
                        <path fill="#E44D26" d="M19 0h90l-8 101-37 27-37-27z"/>
                        <path fill="#F16529" d="M64 8v111l30-22 7-89z"/>
                        <path fill="#fff" d="M64 26H39l1 12h24zm0 24H42l2 12h20zm0 25H46l2 11 16 11z"/>
                    </svg>

                    HTML
                </span>

                <span class="percentage">25%</span>
            </div>

            <div class="bar">
                <div class="progress html"></div>
            </div>
        </div>

        <!-- CSS 20% -->
        <div class="language">
            <div class="language-header">
                <span class="language-name">

                    <!-- CSS logo -->
                    <svg class="language-logo" viewBox="0 0 128 128" aria-hidden="true">
                        <path fill="#1572B6" d="M19 0h90l-8 101-37 27-37-27z"/>
                        <path fill="#33A9DC" d="M64 8v111l30-22 7-89z"/>
                        <path fill="#fff" d="M39 26h50l-1 12H40zm2 24h46l-1 12H43zm3 25h40l-1 11-19 14-19-14z"/>
                    </svg>

                    CSS
                </span>

                <span class="percentage">20%</span>
            </div>

            <div class="bar">
                <div class="progress css"></div>
            </div>
        </div>

        <!-- C++ 7% -->
        <div class="language">
            <div class="language-header">
                <span class="language-name">

                    <!-- C++ logo -->
                    <svg class="language-logo" viewBox="0 0 128 128" aria-hidden="true">
                        <circle cx="64" cy="64" r="58" fill="#00599C"/>
                        <path
                            fill="#fff"
                            d="M72 37c-7-5-15-7-23-7-20 0-35 15-35 34s15 34 35 34c8 0 16-2 23-7l-7-10c-5 3-10 4-15 4-12 0-21-9-21-21s9-21 21-21c5 0 10 1 15 4z"
                        />
                        <path
                            fill="#fff"
                            d="M86 46h7v8h8v7h-8v8h-7v-8h-8v-7h8zm0 31h7v-8h8v-7h-8v-8h-7v8h-8v7h8z"
                        />
                    </svg>

                    C++
                </span>

                <span class="percentage">7%</span>
            </div>

            <div class="bar">
                <div class="progress cpp"></div>
            </div>
        </div>

        <a href="/" class="back">
            Zpět
        </a>

    </div>

</body>
</html>
