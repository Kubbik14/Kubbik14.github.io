<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programovací jazyky</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Poppins", sans-serif;
            color: white;

            background:
                radial-gradient(circle at 15% 20%, rgba(255, 0, 128, 0.35), transparent 35%),
                radial-gradient(circle at 85% 80%, rgba(121, 40, 255, 0.4), transparent 40%),
                #09000f;

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        h1 {
            text-align: center;
            font-size: 38px;
            margin-bottom: 40px;
        }

        .language {
            margin-bottom: 25px;
        }

        .language-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 9px;
        }

        .language-name {
            font-size: 17px;
            font-weight: 600;
        }

        .percentage {
            font-size: 14px;
            opacity: 0.75;
        }

        .bar {
            width: 100%;
            height: 13px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .progress {
            height: 100%;
            border-radius: 20px;
            background: linear-gradient(90deg, #ff0080, #7928ff);
            box-shadow: 0 0 18px rgba(255, 0, 128, 0.35);
        }

        /* Procenta */
        .lua {
            width: 60%;
        }

        .python {
            width: 50%;
        }

        .html {
            width: 25%;
        }

        .css {
            width: 20%;
        }

        .cpp {
            width: 7%;
        }

        .back {
            display: block;
            width: fit-content;
            margin: 40px auto 0;
            padding: 11px 18px;

            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            transition: 0.3s ease;
        }

        .back:hover {
            transform: translateY(-3px);
            background: linear-gradient(135deg, #ff0080, #7928ff);
            box-shadow: 0 10px 30px rgba(255, 0, 128, 0.3);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 30px;
            }

            .language-name {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Programovací jazyky</h1>

        <!-- 60% -->
        <div class="language">
            <div class="language-header">
                <span class="language-name">Lua</span>
                <span class="percentage">60%</span>
            </div>
            <div class="bar">
                <div class="progress lua"></div>
            </div>
        </div>

        <!-- 50% -->
        <div class="language">
            <div class="language-header">
                <span class="language-name">Python</span>
                <span class="percentage">50%</span>
            </div>
            <div class="bar">
                <div class="progress python"></div>
            </div>
        </div>

        <!-- 25% -->
        <div class="language">
            <div class="language-header">
                <span class="language-name">HTML</span>
                <span class="percentage">25%</span>
            </div>
            <div class="bar">
                <div class="progress html"></div>
            </div>
        </div>

        <!-- 20% -->
        <div class="language">
            <div class="language-header">
                <span class="language-name">CSS</span>
                <span class="percentage">20%</span>
            </div>
            <div class="bar">
                <div class="progress css"></div>
            </div>
        </div>

        <!-- 7% -->
        <div class="language">
            <div class="language-header">
                <span class="language-name">C++</span>
                <span class="percentage">7%</span>
            </div>
            <div class="bar">
                <div class="progress cpp"></div>
            </div>
        </div>

        <a href="/" class="back">Zpět</a>

    </div>

</body>
</html>
